name: Validate synthetic research pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run research tests
        run: python -m pytest -q
      - name: Generate synthetic datasets and analyses
        run: python src/pipeline.py
      - name: Upload generated data and analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-farm-succession-data-and-results
          path: |
            data/
            outputs/
          retention-days: 30
